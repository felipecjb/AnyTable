<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyTable Server</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 30rem; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; margin: 0; }
  dt { opacity: .7; }
  dd { margin: 0; }
  .ok { color: #1a8f3c; } .bad { color: #c62828; }
  label { display: block; margin: .6rem 0 .2rem; }
  input[type=number], input[type=password], select { width: 100%; box-sizing: border-box; padding: .35rem; }
  button { margin-top: 1rem; padding: .45rem 1.2rem; }
  #msg { margin-top: .8rem; min-height: 1.2em; }
</style>
</head>
<body>
<h1>AnyTable Server</h1>

<h2>Status</h2>
<dl>
  <dt>Server</dt><dd id="st">…</dd>
  <dt>Display</dt><dd id="disp">…</dd>
  <dt>Address</dt><dd id="addr">…</dd>
  <dt>Clients</dt><dd id="clients">…</dd>
  <dt>Ping</dt><dd id="ping">—</dd>
  <dt>Input</dt><dd id="inp">—</dd>
</dl>

<h2>Settings</h2>
<form id="f">
  <label for="port">Port</label>
  <input id="port" type="number" min="1" max="65535" required>
  <label for="pin">PIN <span id="pinstate"></span></label>
  <input id="pin" type="password" autocomplete="off" placeholder="leave empty to keep current" maxlength="32">
  <label><input id="nopin" type="checkbox"> Remove PIN (no authentication)</label>
  <label for="preset">Quality preset</label>
  <select id="preset">
    <option value="performance">Performance — 60 FPS</option>
    <option value="balanced">Balanced — 45 FPS</option>
    <option value="high">High — 30 FPS</option>
    <option value="custom" disabled>Custom (from config file)</option>
  </select>
  <button type="submit">Save</button>
</form>
<div id="msg"></div>

<script>
const $ = id => document.getElementById(id);
let timer = null, filled = false;

function render(s) {
  if (!s) {
    $('st').textContent = 'Engine not reachable'; $('st').className = 'bad';
    ['disp', 'addr', 'clients', 'inp'].forEach(i => $(i).textContent = '—');
    $('ping').textContent = '—';
    return;
  }
  $('st').textContent = 'Running'; $('st').className = 'ok';
  $('disp').textContent = s.display + (s.display_up ? ' (connected)' : ' (waiting for X11…)');
  $('disp').className = s.display_up ? 'ok' : 'bad';
  $('addr').textContent = (s.ips.length ? s.ips.join(', ') : 'no network') + ' : ' + s.port +
    (s.bind_error ? '  — ' + s.bind_error : '');
  $('clients').textContent = s.clients.length;
  const rtts = s.clients.filter(c => c.rtt_us >= 0).map(c => c.rtt_us);
  $('ping').textContent = rtts.length
    ? 'Ping: ' + Math.round(Math.min(...rtts) / 1000 * 10) / 10 + 'ms' : '—';
  $('inp').textContent = s.input || '—';
  $('pinstate').textContent = s.pin_set ? '(set)' : '(not set)';
  if (!filled) {
    filled = true;
    $('port').value = s.port;
    $('preset').value = s.preset;
  }
}

async function poll() {
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    render(r.ok ? await r.json() : null);
  } catch (e) { render(null); }
  schedule();
}
// Poll only while the window is visible: hidden/minimized or closed = zero activity.
function schedule() {
  clearTimeout(timer);
  if (!document.hidden) timer = setTimeout(poll, 1000);
}
document.addEventListener('visibilitychange', () => { clearTimeout(timer); if (!document.hidden) poll(); });

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const body = { port: parseInt($('port').value, 10) };
  if ($('nopin').checked) body.pin = '';
  else if ($('pin').value !== '') body.pin = $('pin').value;
  if ($('preset').value !== 'custom') body.preset = $('preset').value;
  const msg = $('msg');
  try {
    const r = await fetch('/api/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    msg.textContent = 'Saved.'; msg.className = 'ok';
    $('pin').value = ''; $('nopin').checked = false;
    render(j);
  } catch (e) {
    msg.textContent = 'Error: ' + e.message; msg.className = 'bad';
  }
});

poll();
</script>
</body>
</html>
